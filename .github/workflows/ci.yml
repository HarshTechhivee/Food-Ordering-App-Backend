
name: Backend CI

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development

jobs:
  backend-checks:
    name: TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build
