name: Backend CI and EC2 Deployment

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    name: TypeScript Build and Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Build backend
        run: npm run build

  deploy:
    name: Deploy to EC2 through AWS Systems Manager
    needs: backend-checks
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/development') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/development') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: foodhub-backend-deployment
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Missing repository variable AWS_REGION}"
          : "${EC2_INSTANCE_ID:?Missing repository variable EC2_INSTANCE_ID}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          allowed-account-ids: "162805010640"

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Send deployment command to EC2
        id: send-command
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_COMMAND=$(cat <<'REMOTE_COMMAND'
          sudo -iu ec2-user bash -lc 'set -Eeuo pipefail
          cd /home/ec2-user/Food-Ordering-App-Backend
          test "$(git branch --show-current)" = "development"
          git pull --ff-only origin development
          npm ci
          npm run build
          pm2 restart foodhub-backend
          for attempt in $(seq 1 10); do
            if curl -fsS --max-time 10 https://3.105.27.169/api/health; then
              exit 0
            fi
            sleep 3
          done
          echo "Health check failed after deployment" >&2
          exit 1'
          REMOTE_COMMAND
          )

          PARAMETERS=$(jq -n --arg command "$DEPLOY_COMMAND" '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "FoodHub backend deployment; GitHub run ${GITHUB_RUN_ID}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment and report result
        shell: bash
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "StandardOutputContent" \
                  --output text
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Cancelling|Undeliverable|Terminated)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
                  --output json || true
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for Systems Manager deployment command." >&2
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}' \
            --output json || true
          exit 1
